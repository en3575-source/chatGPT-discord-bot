default_model = "openai"
database = "data/conversations.sqlite3"
context_bytes = 24000
max_turns = 100
retention_days = 30
max_conversations = 10000
max_jobs = 1000
concurrency = 4
max_pending = 32
request_timeout = 180
media_timeout = 600
poll_interval = 10
attachment_bytes = 8388608
input_chars = 4000
reply_channels = []
allowed_user_ids = []
admin_user_ids = []
system_prompt = "You are a helpful assistant."

[backends.openai]
kind = "openai"
base_url = "https://openai.com"
api_key_env = "OPENAI_API_KEY"
account = "openai-project-1"

[models.openai]
backend = "openai"
model = "gpt-4o-mini"
capabilities = ["chat"]
parameters = { max_output_tokens = 4096 }
