toml# Copy to config.toml. Only administrators edit this file.
[bot]
# FIX 1: Changed default_model from "local" to "openai"
default_model = "openai"
database = "data/conversations.sqlite3"
context_bytes = 24000
max_turns = 100
retention_days = 30
max_conversations = 10000
max_jobs = 1000
concurrency = 4
max_pending = 32
request_timeout = 180
media_timeout = 600
poll_interval = 10
attachment_bytes = 8388608
input_chars = 4000
reply_channels = []
allowed_user_ids = []
admin_user_ids = []
system_prompt = "You are a helpful assistant."

[backends.openai]
kind = "openai"
# FIX 2: Point to the official API endpoint instead of a generic website
base_url = "https://openai.com"
api_key_env = "OPENAI_API_KEY"
account = "openai-project-1"

[models.openai]
backend = "openai"
# FIX 3: Changed to a real, active OpenAI model name
model = "gpt-4o-mini"
capabilities = ["chat"]
parameters = { max_output_tokens = 4096 }

[backends.anthropic]
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
account = "anthropic-workspace-1"

[backends.gemini]
kind = "gemini"
api_key_env = "GEMINI_API_KEY"
account = "google-project-1"

[backends.xai]
kind = "xai"
api_key_env = "XAI_API_KEY"
account = "xai-team-1"

[backends.deepseek]
kind = "deepseek"
api_key_env = "DEEPSEEK_API_KEY"
account = "deepseek-account-1"
